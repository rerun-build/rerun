name: Done-test red before green

on:
  pull_request:

concurrency:
  group: red-green-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  prove:
    if: >-
      github.repository == 'special-place-ai-heaven/rerun' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'chunk/')
    name: Done-test red before green
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I tools/factory/redgreen.py

  backtest:
    if: github.head_ref == 'ci/red-before-green'
    name: Back-test on merged pull request ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pr: 432, issue: 394, merge: faab007b }
          - { pr: 433, issue: 428, merge: e4cf40fb }
          - { pr: 434, issue: 421, merge: 2f874773 }
          - { pr: 435, issue: 429, merge: 3882b3d2 }
          - { pr: 436, issue: 425, merge: 4a20bad0 }
          - { pr: 437, issue: 426, merge: 36b485d2 }
          - { pr: 438, issue: 422, merge: 7a14c6c4 }
          - { pr: 439, issue: 427, merge: d7102f34 }
          - { pr: 440, issue: 424, merge: 59bc8a41 }
          - { pr: 441, issue: 423, merge: 4a530f39 }
          - { pr: 442, issue: 430, merge: e56edf68 }
          - { pr: 443, issue: 431, merge: 86d04999 }
          - { pr: 415, issue: 385, merge: 019bb6bb }
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - name: Check out the merge
        working-directory: repo
        run: |
          sha=$(git rev-parse "${{ matrix.merge }}")
          if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -lt 3 ]; then
            sha=$(git log --merges --format=%H --ancestry-path "$sha"..origin/dev | tail -1)
          fi
          git checkout -q --detach "$sha"
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: repo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - working-directory: repo
        run: pnpm install --frozen-lockfile
      - name: Prove
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -I tool/tools/factory/redgreen.py --root repo --issue ${{ matrix.issue }} --base "$SHA^1"
