name: Done-test red before green

on:
  pull_request:

concurrency:
  group: red-green-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  prove:
    needs: route
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Done-test red before green
    runs-on: ${{ fromJSON(needs.route.outputs.heavy || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I tools/factory/redgreen.py --prepare "pnpm --filter @moldwright/contracts build"

