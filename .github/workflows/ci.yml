name: CI

on:
  push:
    branches: [dev, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  route:
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/route.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  check:
    needs: route
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Typecheck and lint
    runs-on: ${{ fromJSON(needs.route.outputs.light || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node -e "process.exit(require('./package.json').pnpm ? 1 : 0)"
      - run: pnpm --filter @moldwright/contracts build
      - run: pnpm -r --if-present ts-check
      - run: pnpm -r --if-present lint

  tests:
    needs: route
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: App tests, filter: rerun }
          - { name: Engine tests, filter: rerun-engine }
    name: ${{ matrix.part.name }}
    runs-on: ${{ fromJSON(needs.route.outputs.heavy || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moldwright/contracts build
      - run: pnpm --filter ${{ matrix.part.filter }} run test --maxWorkers=4

  migrations:
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Migrations and seed on a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.113.0
      - run: supabase db start
      - run: supabase db reset --local
      - name: "Engine key replacement: database rehearsal"
        run: |
          set -eu
          key=feedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeed
          db() { docker exec -i -u postgres supabase_db_rerun psql -X -q -t -A -v ON_ERROR_STOP=1 -d postgres; }
          printf '%s\n' "insert into public.engine_pool (engine_host, engine_api_key, status) values ('http://engine:3000', '$key', 'claimed');" | db
          printf "RERUN_ENGINE_API_KEY='%s'\n" "$key" > .env
          out=$(SUPABASE_DB_CONTAINER=supabase_db_rerun sh deploy/vps/rotate-engine-key.sh check)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fxq 'db-rows-holding-current-key 1 (expect 1)'
          printf '%s\n' "$out" | grep -Fxq 'db-rehearsal swapped (rolled back)'
          printf '%s\n' "$out" | grep -Eq '^db-triggers-on-engine_pool [A-Za-z0-9_,]+$'
          printf '%s\n' "$out" | grep -Eq '^db-publications-with-engine_pool [A-Za-z0-9_,]+$'
          if printf '%s\n' "$out" | grep -Eq '^db-(triggers|publications)-.* error$'; then exit 1; fi
          test "$(printf '%s\n' "select count(*) from public.engine_pool where engine_api_key = '$key';" | db)" = 1

  docker-inputs:
    needs: route
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Docker inputs changed
    runs-on: ${{ fromJSON(needs.route.outputs.light || '"ubuntu-latest"') }}
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)Dockerfile$|(^|/)\.dockerignore$|^docker-compose\.yml$|(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^apps/ui/next\.config\.|^\.github/workflows/ci\.yml$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: [route, docker-inputs]
    if: >-
      !cancelled() && github.repository_owner == 'special-place-ai-heaven' &&
      ((github.event_name == 'push' && github.ref != 'refs/heads/dev') || needs.docker-inputs.outputs.changed == 'true')
    name: Docker images build
    runs-on: ${{ fromJSON(needs.route.outputs.heavy || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Engine
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/engine/Dockerfile
          push: false
          cache-from: type=gha,scope=engine
      - name: App
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/ui/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54421
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci
          cache-from: type=gha,scope=app
