name: CI

on:
  push:
    branches: [dev, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs in the open source repository only, not in a private clone of it.
    if: github.repository == 'rerun-build/rerun'
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - run: pnpm -r --if-present ts-check
      - run: pnpm --filter rerun lint
      - run: pnpm --filter rerun test
      - run: pnpm --filter rerun-engine test
      # Every mobile test runs as iOS and as Android (jest projects of apps/mobile/jest.config.js).
      - run: pnpm --filter rerun-mobile test
      # The desktop app: its rules (URLs, permissions, IPC senders) and its three bundles.
      - run: pnpm --filter rerun-desktop test
      - run: pnpm --filter rerun-desktop build

  # No network and no install: the check only reads packages/i18n, so it answers in seconds instead of
  # waiting behind the typecheck.
  i18n:
    # Runs in the open source repository only, not in a private clone of it.
    if: github.repository == 'rerun-build/rerun'
    name: Language packs match the English source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm i18n:check

  # The Kotlin twins of the app's native modules: their JUnit and Robolectric tests, on a pull request
  # that touches what goes into the Android build, and on every push.
  mobile-native-inputs:
    if: github.repository == 'rerun-build/rerun' && github.event_name == 'pull_request'
    name: Mobile native inputs changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^apps/mobile/(modules|plugins)/|^apps/mobile/(app\.json|app\.config\.ts|package\.json)$|^pnpm-lock\.yaml$|^\.github/workflows/ci\.yml$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  mobile-native:
    needs: mobile-native-inputs
    if: >-
      always() && github.repository == 'rerun-build/rerun' &&
      (github.event_name == 'push' || needs.mobile-native-inputs.outputs.changed == 'true')
    name: Mobile native modules (Android unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          EXPO_NO_GIT_STATUS: '1'
      - working-directory: apps/mobile/android
        run: ./gradlew :composer-paste:testDebugUnitTest :background-grace:testDebugUnitTest --console=plain

  migrations:
    # Runs in the open source repository only, not in a private clone of it.
    if: github.repository == 'rerun-build/rerun'
    name: Migrations and seed on a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: supabase db start
      - run: supabase db reset --local

  # An image takes ~10 minutes to build: a pull request only builds them when it touches what
  # goes into them beyond the code the other jobs already check, and every push to master and
  # staging builds them anyway before anything ships.
  docker-inputs:
    if: github.repository == 'rerun-build/rerun' && github.event_name == 'pull_request'
    name: Docker inputs changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)Dockerfile$|(^|/)\.dockerignore$|^docker-compose\.yml$|(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^apps/ui/next\.config\.|^\.github/workflows/ci\.yml$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  images:
    # Runs in the open source repository only, not in a private clone of it.
    needs: docker-inputs
    if: >-
      always() && github.repository == 'rerun-build/rerun' &&
      ((github.event_name == 'push' && github.ref != 'refs/heads/dev') || needs.docker-inputs.outputs.changed == 'true')
    name: Docker image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: engine
            file: apps/engine/Dockerfile
            build-args: ''
          - image: app
            file: apps/ui/Dockerfile
            build-args: |
              NEXT_PUBLIC_APP_URL=http://localhost:3000
              NEXT_PUBLIC_SUPABASE_URL=http://localhost:54421
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          build-args: ${{ matrix.build-args }}
          # The cache lives in a registry rather than in the cache of the Actions runner: a pull
          # request can only read the cache of its own branch and the one of the default branch,
          # which never builds an image, so a cache written there was read by nobody and ate the
          # 10 GB the whole repository shares. A push writes it, every pull request reads it.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rerun-buildcache:${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,mode=max,ref=ghcr.io/{0}/rerun-buildcache:{1}', github.repository_owner, matrix.image) || '' }}
