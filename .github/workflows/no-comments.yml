name: No comments in code

on:
  pull_request:

concurrency:
  group: no-comments-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  check:
    needs: route
    if: github.repository_owner == 'special-place-ai-heaven'
    name: No comments in code
    runs-on: ${{ fromJSON(needs.route.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --prefix /tmp/ts --no-save --silent typescript@5.9.3
      - run: python -m pip install --quiet pyyaml
      - name: Tests of the check
        env:
          TS_MODULE: /tmp/ts
        run: python -I -m unittest discover -s scripts/strip-comments -p "test_*.py" -v
      - name: Check the files this pull request adds or changes
        run: |
          git diff -z --name-only --diff-filter=AM HEAD^1 HEAD > /tmp/changed.bin
          if [ ! -s /tmp/changed.bin ]; then echo "No added or changed files."; exit 0; fi
          xargs -0 python -I scripts/strip-comments/strip.py --root . --ts-module /tmp/ts --check --only < /tmp/changed.bin
