name: Factory tools

on:
  push:
    branches: [dev]
    paths: ['tools/factory/**', 'deploy/vps/**', '.github/workflows/factory-tools.yml']
  pull_request:
    paths: ['tools/factory/**', 'deploy/vps/**', '.github/workflows/factory-tools.yml']

concurrency:
  group: factory-tools-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Factory tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: pipx run ruff==0.17.5 check tools/factory
      - name: Unit tests
        working-directory: tools/factory
        run: python3 -I -m unittest discover -s . -p "test_*.py" -v
