name: Purge suites check

on:
  pull_request:

permissions:
  contents: read

jobs:
  suites:
    if: github.head_ref == 'chore/strip-comments'
    name: ${{ matrix.pkg }} on ${{ matrix.side }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        side: [dev, purge]
        pkg: [rerun-mobile, rerun-desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'dev' && 'dev' || github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - run: pnpm --filter ${{ matrix.pkg }} test
