name: Refactor commits leave tests alone

on:
  pull_request:

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  frozen:
    needs: route
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Refactor commits leave tests alone
    runs-on: ${{ fromJSON(needs.route.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: python3 -I tools/factory/refactorcheck.py --base HEAD^1
