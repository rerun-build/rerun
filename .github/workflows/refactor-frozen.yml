name: Refactor commits leave tests alone

on:
  pull_request:

permissions:
  contents: read

jobs:
  frozen:
    if: >-
      github.repository_owner == 'special-place-ai-heaven' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Refactor commits leave tests alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -I tools/factory/refactorcheck.py --base HEAD^1
