name: Route

on:
  workflow_call:
    secrets:
      RUNNER_STATUS_TOKEN:
        required: false
    outputs:
      light:
        value: ${{ jobs.pick.outputs.light }}
      heavy:
        value: ${{ jobs.pick.outputs.heavy }}

permissions: {}

jobs:
  pick:
    name: Pick runners
    runs-on: ubuntu-latest
    outputs:
      light: ${{ steps.pick.outputs.light }}
      heavy: ${{ steps.pick.outputs.heavy }}
    steps:
      - id: pick
        env:
          RUNNERS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          ORG: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          OVERRIDE_LIGHT: ${{ vars.CI_RUNS_ON_LIGHT }}
          OVERRIDE_HEAVY: ${{ vars.CI_RUNS_ON_HEAVY }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          hosted='"ubuntu-latest"'
          light=$hosted
          heavy=$hosted
          trusted=1
          [ "$ORG" = special-place-ai-heaven ] || trusted=0
          case "$EVENT" in
            push|workflow_dispatch|schedule) ;;
            pull_request) [ "$HEAD_REPO" = "$REPO" ] || trusted=0 ;;
            *) trusted=0 ;;
          esac
          if [ "$ACTOR" = "dependabot[bot]" ] || [ "$TRIGGERING_ACTOR" = "dependabot[bot]" ]; then
            trusted=0
          fi
          if [ "$trusted" = 1 ]; then
            runners=''
            if [ -n "$RUNNERS_TOKEN" ]; then
              runners=$(GH_TOKEN="$RUNNERS_TOKEN" gh api "orgs/$ORG/actions/runners?per_page=100" 2>/dev/null) || runners=''
            fi
            if [ -n "$runners" ]; then
              echo "$runners" | jq -r '(.runners // [])[] | "runner: \(.name) status=\(.status) busy=\(.busy) labels=\([.labels[].name] | join(","))"'
              idle() { echo "$runners" | jq --arg c "$1" '[(.runners // [])[] | select(.status == "online" and (.busy | not) and any(.labels[]; (.name | ascii_downcase) == $c))] | length'; }
              [ "$(idle light)" -gt 0 ] && light='{"group":"aap-crrr","labels":["self-hosted","linux","light"]}'
              [ "$(idle heavy)" -gt 0 ] && heavy='{"group":"aap-crrr","labels":["self-hosted","linux","heavy"]}'
            else
              echo "::warning::runner status not readable, every job runs GitHub-hosted"
            fi
            [ -n "$OVERRIDE_LIGHT" ] && light=$OVERRIDE_LIGHT
            [ -n "$OVERRIDE_HEAVY" ] && heavy=$OVERRIDE_HEAVY
          else
            if [ "$ACTOR" = "dependabot[bot]" ] || [ "$TRIGGERING_ACTOR" = "dependabot[bot]" ]; then
              echo "dependabot, every job runs GitHub-hosted"
            else
              echo "untrusted or foreign event ($EVENT), every job runs GitHub-hosted"
            fi
          fi
          echo "light=$light" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "light: $light | heavy: $heavy"
