name: No stubs or switched-off tests

on:
  pull_request:

concurrency:
  group: no-stubs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  check:
    needs: route
    if: github.repository_owner == 'special-place-ai-heaven'
    name: No stubs or switched-off tests
    runs-on: ${{ fromJSON(needs.route.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Tests of the check
        run: python -I -m unittest discover -s scripts/no-stubs -p "test_*.py" -v
      - name: Check the lines this pull request adds
        run: python -I scripts/no-stubs/check.py HEAD^1
