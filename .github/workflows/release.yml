name: Release

# Builds the engine image the Servers page tells people to run. The Version workflow calls it on
# every push to master; a tag pushed by hand runs it too.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  engine-image:
    # Runs in the open source repository only, not in a private clone of it.
    if: github.repository == 'rerun-build/rerun'
    runs-on: ubuntu-latest
    steps:
      # The two-platform build fills the runner's disk ("No space left on device" on v0.1.0):
      # the preinstalled toolchains it never uses take ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rerun-engine
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The second one is what the CI of the same push already built for linux/amd64.
          cache-from: |
            type=gha,scope=engine
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/rerun-buildcache:engine
          cache-to: type=gha,mode=max,scope=engine
