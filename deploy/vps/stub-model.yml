name: rerun-dev

services:
  stub-model:
    image: python:3.12-slim
    command: ["python", "/app/stub_model.py", "8080"]
    environment:
      STUB_HOLD_SECONDS: ${STUB_HOLD_SECONDS:-1800}
    volumes:
      - ../../tools/factory/stub_model.py:/app/stub_model.py:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
