name: rerun-factory

services:
  factory-dispatcher:
    build:
      context: .
      dockerfile: factory-runner.Dockerfile
    working_dir: /app
    command: ["python3", "-u", "/app/launch.py"]
    environment:
      FACTORY_DATA_DIR: /state
      FACTORY_DISPATCHER: "1"
      HOME: /tmp
      DISPATCH_ACCOUNT_URL: ${FACTORY_ACCOUNT_URL:?set FACTORY_ACCOUNT_URL in deploy/vps/.env}
      FACTORY_KEEPER_FILE: /keeper/machine.json
    volumes:
      - ../../tools/factory:/app:ro
      - factory-dispatcher-data:/state
      - /var/lib/rerun-keeper:/keeper:ro
      - factory-token:/token:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    deploy:
      replicas: ${FACTORY_DISPATCHER:-1}
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/state/heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s
    secrets:
      - gh_token
      - account_key

secrets:
  gh_token:
    file: ${FACTORY_GH_TOKEN_FILE:?set FACTORY_GH_TOKEN_FILE in deploy/vps/.env}
  account_key:
    file: ${FACTORY_ACCOUNT_KEY_FILE:?set FACTORY_ACCOUNT_KEY_FILE in deploy/vps/.env}

volumes:
  factory-dispatcher-data:
    name: rerun-factory_factory-dispatcher-data
  factory-token:
    name: rerun_factory-token
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0755,size=64k"}
