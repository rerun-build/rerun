name: rerun-dev

x-required-key: ${RERUN_DEV_ENGINE_KEY:?set RERUN_DEV_ENGINE_KEY in deploy/vps/.env}

services:
  engine-dev:
    image: ghcr.io/special-place-ai-heaven/moldwright-engine:${RERUN_DEV_IMAGE_TAG:-dev}
    environment:
      RERUN_LOG_LEVEL: ${RERUN_LOG_LEVEL:-info}
      RERUN_API_KEY_FILE: /run/secrets/rerun_dev_engine_key
    secrets:
      - rerun_dev_engine_key
    volumes:
      - engine-dev-data:/data
    mem_limit: 3g
    cpus: 2
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  engine-dev-data:

secrets:
  rerun_dev_engine_key:
    environment: RERUN_DEV_ENGINE_KEY
