"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# The team's checkout clones the private `cloud/` next to the code when it has access to it
# (`clone-cloud.sh`: from the main checkout's copy on the Mac, from GitHub otherwise; a contributor without
# access gets the open source build and a warning), then runs cloud/'s own setup steps when they are there:
# joining the tailnet, linking the Supabase project, starting on the production profile. Each of them
# is allowed to fail, so a workspace without credentials still finishes its setup.
#
# `cloud/` is a pnpm workspace of its own: the root `postinstall` installs it after the root, since its
# packages link to the dependencies of `apps/ui`, and puts in place the links of `cloud/links.txt`.
#
# `@rerun/contracts` resolves to its gitignored `dist/`, so the UI and the engine fail on "Can't resolve
# '@rerun/contracts'" until it is built.
setup = "bash .conductor/clone-cloud.sh && ([ ! -f cloud/conductor/tailscale-up.sh ] || bash cloud/conductor/tailscale-up.sh setup) && pnpm install --force && pnpm build:contracts && (pnpm cloud db:link || true) && (pnpm cloud env:prod || true)"
run_mode = "concurrent"

# Cloud workspaces only: on the Mac the actions live in `.conductor/settings.local.toml` of the main
# checkout, which also carries the personal prompts and the cloud MCP keys. `CONDUCTOR_PORT` does not
# exist in the cloud, hence the fixed ports: ui 3050, landing 3049, admin 3052, emails 3053, docs 3333.
#
# A cloud workspace is shown ready while its setup still runs `pnpm install`: every action that needs
# the dependencies goes through `wait-for-setup.sh`, or it fails on `Command "next" not found`.
#
# Each server action first runs `free-port.sh` on its ports: a server left over from an earlier run
# or from `pnpm verify:ui` would otherwise make it die on EADDRINUSE.
[scripts.run.ui]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && bash .conductor/free-port.sh 3050 && pnpm --filter rerun exec next dev -p 3050"
default = true
icon = "monitor"

[scripts.run.landing]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && bash .conductor/free-port.sh 3049 && pnpm --dir cloud/apps/landing exec next dev -p 3049"
icon = "globe"

[scripts.run.admin]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && bash .conductor/free-port.sh 3052 && pnpm --dir cloud/apps/admin exec next dev -p 3052"
icon = "shield"

[scripts.run.engine]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && bash .conductor/free-port.sh engine && pnpm dev:engine"
icon = "server"

[scripts.run.everything]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && bash .conductor/free-port.sh 3050 3049 engine 3053 && pnpm exec concurrently -k -n ui,landing,engine,emails -c cyan,blue,green,gray \"pnpm --filter rerun exec next dev -p 3050\" \"pnpm --dir cloud/apps/landing exec next dev -p 3049\" \"pnpm dev:engine\" \"EMAIL_ASSET_ORIGIN=http://localhost:3050 pnpm --filter @rerun/emails exec email dev --dir emails --port 3053\""
icon = "play"

[scripts.run.emails]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && bash .conductor/free-port.sh 3053 && EMAIL_ASSET_ORIGIN=http://localhost:3050 pnpm --filter @rerun/emails exec email dev --dir emails --port 3053"
icon = "mail"

[scripts.run.docs]
available_in = [ "cloud" ]
command = "bash .conductor/free-port.sh 3333 && pnpm dev:docs"
icon = "book-open"

[scripts.run.docs-check]
available_in = [ "cloud" ]
command = "pnpm check:docs"
icon = "badge-check"

[scripts.run.env]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && pnpm cloud pick env"
icon = "flask-conical"

[scripts.run.trigger]
available_in = [ "cloud" ]
command = "bash .conductor/wait-for-setup.sh && pnpm cloud trigger:dev"
icon = "zap"

[scripts.run.tailnet]
available_in = [ "cloud" ]
command = "bash cloud/conductor/tailscale-up.sh && tailscale status"
icon = "network"

[scripts.run.stop]
available_in = [ "cloud" ]
command = "pids=$(pgrep -f '[n]ext dev|[n]ext-server|[e]mail dev|[r]eact-email/dist/cli|[c]oncurrently/dist/bin|[t]rigger dev|[s]rc/cli/bin.ts run|[m]int dev'); if [ -n \"$pids\" ]; then kill $pids && echo \"Stopped $(echo $pids | wc -w | tr -d ' ') process(es)\"; else echo \"Nothing running\"; fi"
icon = "circle-stop"
