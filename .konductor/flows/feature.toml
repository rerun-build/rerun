# Konductor flow for a Linear issue labeled Feature: design in a render lab until you validate it, design brief, plan in a
# new Fable 5.2 chat, build, review, review fixes, summary, PR, merge, then close the card.
# Format: https://github.com/ClementJanssens/konductor/blob/master/docs/flows.md
name = "Feature"
match = { labels = ["Feature"] }

[[steps]]
id = "design"
title = "Design"
chat = "design"
attach_issue = true
prompt = """
Passe la carte Linear {{issue.identifier}} en In Progress avec le MCP Linear si elle n'y est pas déjà.
Le ticket complet est dans {{issue.file}}.
Vérifie que la feature n'existe pas déjà, puis fais un render lab de preview (`app/render/lab/<sujet>`) avec 2 ou 3
variantes, et donne-moi l'URL et les captures.
Après chaque version, demande avec AskUserQuestion : « Validé, on planifie » ou « Encore une itération ». Ne termine
jamais ton tour sans cette question, sauf quand je choisis « Validé, on planifie » : la fin de ton tour lance l'étape suivante.
"""

[[steps]]
id = "brief"
title = "Design brief"
chat = "design"
prompt = """
Écris {{run.dir}}/design.md : le besoin, l'existant à réutiliser, le design validé (render lab, URL, captures), mes retours
et les décisions. La conversation suivante ne verra que ce fichier. Réponds avec son chemin.
"""

[[steps]]
id = "plan"
title = "Plan the feature"
chat = "build"
model = "fable-5-2"
attach_issue = true
plan = true
approve = "auto"
prompt = """
Lis {{run.dir}}/design.md, le render lab qu'il cite et le ticket {{issue.file}}, puis planifie la feature {{issue.identifier}}.
Le render lab fait foi : la feature doit lui ressembler.
"""

[[steps]]
id = "build"
title = "Build"
chat = "build"
prompt = """
Construis le plan approuvé, lance les tests à distance et vérifie dans l'app avec verify-in-app en comparant au render lab.
Ne crée ni commit, ni push, ni pull request.
"""

[[steps]]
id = "review"
title = "Review"
kind = "review"

[[steps]]
id = "fixes"
title = "Review fixes"
chat = "review"
plan = true
approve = "human"
comments = ["blocking", "major", "minor", "nit"]
skip_if_no_comments = true
prompt = """
Voici les {{comments.count}} remarques de la review.
Planifie la correction des blocking et major, et des minor / nit faciles. Dis pourquoi tu écartes les autres.
"""

[[steps]]
id = "summary"
title = "Summary"
chat = "summary"
linear_comment = true
prompt = """
Lis {{issue.file}}, {{run.dir}}/design.md et le diff du workspace (GetWorkspaceDiff). Ne crée ni commit, ni push, ni pull request.
Résume pour la personne qui merge : la feature, ce qui a été construit, comment c'est testé. Court, en français.
"""

[[steps]]
id = "pr"
title = "Create PR"
kind = "create_pr"

[[steps]]
id = "merge"
title = "Merge"
kind = "wait_merge"

[[steps]]
id = "close"
title = "Close the card"
chat = "summary"
linear_comment = true
prompt = """
La PR de {{issue.identifier}} est mergée. Passe la carte Linear en Done si elle n'y est pas déjà, puis écris sa mise à
jour finale : la PR, ce qui a été livré. Court, en français, sans clé ni contenu privé du client.
"""
