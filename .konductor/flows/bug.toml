# Konductor flow for a Linear issue labeled Bug: move the card to In Progress, investigate, wait for your go, plan (approved by the flow), review, fix the review
# (plan approved by you), summary on the issue, wait for the PR you open and merge, then close the card.
# Format: https://github.com/ClementJanssens/konductor/blob/master/docs/flows.md
name = "Bug"
match = { labels = ["Bug"] }

[[steps]]
id = "investigate"
title = "Investigate"
model = "opus-5-5-1m"
attach_issue = true
prompt = """
Avant toute chose, passe la carte Linear {{issue.identifier}} en In Progress avec le MCP Linear si elle n'y est pas déjà.

/investigate-bug {{issue.url}}

Le ticket Linear complet (description, images) est dans {{issue.file}}.

Tu peux te connecter en SSH à l'engine pour diagnostiquer la cause, et lire tous les logs dont tu as besoin
dans PostHog ou dans Supabase. Fais une analyse complète et essaye de reproduire le bug au maximum.

Si le bug est isolé (un seul client, cause hors de Rerun : son provider, son réseau, sa config) ou un peu wtf
(incohérent, inexplicable, ou un correctif disproportionné pour l'impact), ouvre ton message par une alerte :
explique ce qui le rend isolé ou bizarre, avec les preuves, et recommande de corriger, de clore ou de creuser.

C'est moi qui décide si on continue. Après ton rapport, demande avec AskUserQuestion : « Corriger », « Creuser encore »
ou « Clore ». Sur « Creuser encore », reprends l'enquête avec ce que je te dis, puis repose la question. Ne termine
jamais ton tour sans cette question, sauf quand je choisis « Corriger » ou « Clore » : la fin de ton tour lance l'étape suivante.
"""

[[steps]]
id = "plan"
title = "Plan the fix"
model = "opus-5-5-1m"
plan = true
approve = "auto"
prompt = """
Si j'ai choisi « Clore » à la fin de l'investigation, ne planifie rien : rappelle en deux lignes pourquoi on clôt et
arrête-toi sans plan, le flow attend que je l'annule.
Sinon, planifie le fix à partir de ton investigation : la cause racine, le correctif au bon endroit, et le test qui
reproduit le bug puis prouve le fix.
"""

[[steps]]
id = "review"
title = "Review"
kind = "review"

[[steps]]
id = "fixes"
title = "Review fixes"
chat = "review"
model = "opus-5-5-1m"
plan = true
approve = "human"
comments = ["blocking", "major", "minor", "nit"]
skip_if_no_comments = true
prompt = """
Voici les {{comments.count}} remarques de la review, chacune avec sa sévérité.
Planifie la correction de toutes les remarques blocking et major, et des minor / nit qui sont des quick wins.
Pour chaque remarque que tu écartes, dis pourquoi.
"""

[[steps]]
id = "summary"
title = "Summary"
chat = "summary"
model = "opus-5-5-1m"
linear_comment = true
prompt = """
Lis {{issue.file}} et le diff de ce workspace (GetWorkspaceDiff). Ne crée ni commit, ni push, ni pull request :
c'est moi qui ouvre la PR.
Écris un résumé pour la personne qui va relire et merger : le bug, sa cause, ce qui a été corrigé et comment,
comment c'est testé, et ce qu'il reste à vérifier avant de merger. Court, en français.
"""

[[steps]]
id = "merge"
title = "Merge"
kind = "wait_merge"

[[steps]]
id = "close"
title = "Close the card"
chat = "summary"
linear_comment = true
prompt = """
La PR de {{issue.identifier}} est mergée. Passe la carte Linear en Done avec le MCP Linear si elle n'y est pas déjà,
puis écris sa mise à jour finale, postée telle quelle sur la carte : la PR mergée, la cause du bug, ce qui a été
corrigé et comment c'est prouvé. Court, en français, sans clé, token ni contenu privé du client.
"""
