# Konductor flow for a Linear issue labeled Bug: move the card to In Progress, investigate, plan (approved by the flow), review, fix the review
# (plan approved by you), summary on the issue, wait for the pull request you open and merge yourself, then close the card.
# Format: https://github.com/ClementJanssens/konductor/blob/master/docs/flows.md
name = "Bug"
match = { labels = ["Bug"] }

[[steps]]
id = "investigate"
title = "Investigate"
attach_issue = true
prompt = """
Avant toute chose, passe la carte Linear {{issue.identifier}} en In Progress avec le MCP Linear si elle n'y est pas déjà.

/investigate-bug {{issue.url}}

Le ticket Linear complet (description, images) est dans {{issue.file}}.

Tu peux te connecter en SSH à l'engine pour diagnostiquer la cause, et lire tous les logs dont tu as besoin
dans PostHog ou dans Supabase. Fais une analyse complète et essaye de reproduire le bug au maximum.
"""

[[steps]]
id = "plan"
title = "Plan the fix"
plan = true
approve = "auto"
prompt = "Planifie le fix à partir de ton investigation : la cause racine, le correctif au bon endroit, et le test qui reproduit le bug puis prouve le fix."

[[steps]]
id = "review"
title = "Review"
kind = "review"

[[steps]]
id = "fixes"
title = "Review fixes"
plan = true
approve = "human"
comments = ["blocking", "major", "minor", "nit"]
skip_if_no_comments = true
prompt = """
Voici les {{comments.count}} remarques de la review, chacune avec sa sévérité.
Planifie la correction de toutes les remarques blocking et major, et des minor / nit qui sont des quick wins.
Pour chaque remarque que tu écartes, dis pourquoi.
"""

[[steps]]
id = "summary"
title = "Summary"
chat = "summary"
linear_comment = true
prompt = """
Lis {{issue.file}} et le diff de ce workspace (GetWorkspaceDiff). Ne crée ni commit, ni push, ni pull request :
la personne qui relit ouvre la PR et la merge elle-même.
Écris un résumé pour elle : le bug, sa cause, ce qui a été corrigé et comment,
comment c'est testé, et ce qu'il reste à vérifier avant de merger. Court, en français.
"""

[[steps]]
id = "merge"
title = "Merge"
kind = "wait_merge"

[[steps]]
id = "close"
title = "Close the card"
chat = "summary"
linear_comment = true
prompt = """
La PR de {{issue.identifier}} est mergée. Passe la carte Linear en Done avec le MCP Linear si elle n'y est pas déjà,
puis écris sa mise à jour finale, postée telle quelle sur la carte : la PR mergée, la cause du bug, ce qui a été
corrigé et comment c'est prouvé. Court, en français, sans clé, token ni contenu privé du client.
"""
