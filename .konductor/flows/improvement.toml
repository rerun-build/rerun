# Konductor flow for a Linear issue labeled Improvement: context, plan and build (Opus 5.5), review, review fixes, summary,
# PR, merge, then close the card.
# Plan and build are one step: an approved plan is built in the same turn, so a separate Build step would start after it.
# Format: https://github.com/ClementJanssens/konductor/blob/master/docs/flows.md
name = "Improvement"
match = { labels = ["Improvement"] }

[[steps]]
id = "context"
title = "Context"
model = "opus-5-5-1m"
attach_issue = true
prompt = """
Passe la carte Linear {{issue.identifier}} en In Progress avec le MCP Linear si elle n'y est pas déjà.
Le ticket complet est dans {{issue.file}}.
Vérifie que l'amélioration n'est pas déjà faite, puis rassemble le contexte du code concerné.
"""

[[steps]]
id = "plan"
title = "Plan and build"
model = "opus-5-5-1m"
plan = true
approve = "auto"
prompt = """
Planifie l'amélioration à partir de ce contexte. Une fois le plan approuvé, construis-le, lance les tests à distance et
vérifie dans l'app avec verify-in-app si ça se voit. Ne crée ni commit, ni push, ni pull request.
"""

[[steps]]
id = "review"
title = "Review"
kind = "review"

[[steps]]
id = "fixes"
title = "Review fixes"
chat = "review"
model = "opus-5-5-1m"
plan = true
approve = "human"
comments = ["blocking", "major", "minor", "nit"]
skip_if_no_comments = true
prompt = """
Voici les {{comments.count}} remarques de la review.
Planifie la correction des blocking et major, et des minor / nit faciles. Dis pourquoi tu écartes les autres.
"""

[[steps]]
id = "summary"
title = "Summary"
chat = "summary"
model = "opus-5-5-1m"
linear_comment = true
prompt = """
Lis {{issue.file}} et le diff du workspace (GetWorkspaceDiff). Ne crée ni commit, ni push, ni pull request.
Résume pour la personne qui merge : l'amélioration, ce qui a changé, comment c'est testé. Court, en français.
"""

[[steps]]
id = "pr"
title = "Create PR"
kind = "create_pr"

[[steps]]
id = "merge"
title = "Merge"
kind = "wait_merge"

[[steps]]
id = "close"
title = "Close the card"
chat = "summary"
linear_comment = true
prompt = """
La PR de {{issue.identifier}} est mergée. Passe la carte Linear en Done si elle n'y est pas déjà, puis écris sa mise à
jour finale : la PR, ce qui a été livré. Court, en français, sans clé ni contenu privé du client.
"""
