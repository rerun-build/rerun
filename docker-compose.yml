name: rerun

services:
  app:
    image: ghcr.io/special-place-ai-heaven/moldwright:${RERUN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
        NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
    env_file: .env
    environment:
      RERUN_ENGINE_URL: http://engine:3000
      RERUN_ENGINE_API_KEY: ${RERUN_ENGINE_API_KEY:?set RERUN_ENGINE_API_KEY in .env}
      RERUN_ENGINE_BROWSER_URL: ${RERUN_ENGINE_BROWSER_URL:-http://localhost:3001}
      RERUN_SHOT_URL: ${RERUN_SHOT_URL:-http://engine:3000}
      RERUN_SHOT_API_KEY: ${RERUN_ENGINE_API_KEY:?set RERUN_ENGINE_API_KEY in .env}
      RERUN_SHOT_RENDER_ORIGIN: ${RERUN_SHOT_RENDER_ORIGIN:-http://app:3000}
    ports:
      - "${RERUN_BIND_ADDRESS:-127.0.0.1}:${RERUN_APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  engine:
    image: ghcr.io/special-place-ai-heaven/moldwright-engine:${RERUN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    environment:
      RERUN_API_KEY_FILE: /run/secrets/rerun_engine_key
      RERUN_HUB_BASE_URL: http://app:3000
      RERUN_LOG_LEVEL: ${RERUN_LOG_LEVEL:-info}
      RERUN_FS_EXTRA_ROOTS: ${RERUN_FS_EXTRA_ROOTS:-/data/work/wt}
    ports:
      - "${RERUN_BIND_ADDRESS:-127.0.0.1}:${RERUN_ENGINE_PORT:-3001}:3000"
    secrets:
      - rerun_engine_key
    volumes:
      - engine-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 2gb
    restart: unless-stopped

  supabase-bridge:
    image: alpine/socat:1.8.0.3
    profiles: ["local-supabase"]
    network_mode: "service:app"
    depends_on: [app]
    command: TCP-LISTEN:54421,fork,reuseaddr TCP:host.docker.internal:54421
    restart: unless-stopped

volumes:
  engine-data:
    name: rerun_engine-data

secrets:
  rerun_engine_key:
    environment: RERUN_ENGINE_API_KEY
